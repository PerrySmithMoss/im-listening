version: "3.9"

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to the GHCR image by digest}
    environment:
      CLIENT_ORIGIN: https://im-listening.vercel.app
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_CA_FILE: /etc/im-listening/postgres-ca.crt
      SESSION_SECRET_FILE: /run/secrets/session_secret
      REDIS_URL_FILE: /run/secrets/redis_url
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set the production Google OAuth client ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_PROXY_SECRET_FILE: /run/secrets/google_proxy_secret
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: resend
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: password-reset@imlistening-mail.perrysmithmoss.com
    secrets:
      - {source: im_listening_database_url_v1, target: database_url, uid: "1000", mode: 0400}
      - {source: im_listening_session_secret_v1, target: session_secret, uid: "1000", mode: 0400}
      - {source: im_listening_redis_url_v2, target: redis_url, uid: "1000", mode: 0400}
      - {source: im_listening_resend_key_v1, target: smtp_password, uid: "1000", mode: 0400}
      - {source: im_listening_google_oauth_v1, target: google_client_secret, uid: "1000", mode: 0400}
      - {source: im_listening_google_proxy_v2, target: google_proxy_secret, uid: "1000", mode: 0400}
    configs:
      - {source: im_listening_postgres_ca_v1, target: /etc/im-listening/postgres-ca.crt}
    networks: [im_listening_ingress, im_listening_database, im_listening_redis_clients]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 16777216, mode: 01777}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 45s
      retries: 3
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: im_listening_ingress
        traefik.http.routers.im-listening-api.rule: Host(`im-listening-api.perrysmithmoss.com`)
        traefik.http.routers.im-listening-api.entrypoints: websecure
        traefik.http.routers.im-listening-api.tls.certresolver: myresolver
        traefik.http.routers.im-listening-auth.rule: Host(`im-listening-api.perrysmithmoss.com`) && PathPrefix(`/auth/google/`)
        traefik.http.routers.im-listening-auth.entrypoints: websecure
        traefik.http.routers.im-listening-auth.tls.certresolver: myresolver
        traefik.http.routers.im-listening-auth.service: im-listening-api
        traefik.http.routers.im-listening-auth.observability.accesslogs: "false"
        traefik.http.routers.im-listening-auth.observability.tracing: "false"
        traefik.http.services.im-listening-api.loadbalancer.server.port: "5050"
      resources:
        limits: {memory: 384M, cpus: "0.75", pids: 128}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 90s
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 100s

networks:
  im_listening_ingress:
    external: true
  im_listening_database:
    external: true
  im_listening_redis_clients:
    external: true

configs:
  im_listening_postgres_ca_v1: {external: true}

secrets:
  im_listening_database_url_v1: {external: true}
  im_listening_session_secret_v1: {external: true}
  im_listening_resend_key_v1: {external: true}
  im_listening_google_oauth_v1: {external: true}
  im_listening_google_proxy_v2: {external: true}
  im_listening_redis_url_v2: {external: true}
