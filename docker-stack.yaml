version: "3.9"

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to the GHCR image by digest}
    environment:
      CLIENT_ORIGIN: https://im-listening.vercel.app
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_CA_FILE: /etc/im-listening/postgres-ca.crt
      SESSION_SECRET_FILE: /run/secrets/session_secret
      REDIS_URL_FILE: /run/secrets/redis_url
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: resend
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: password-reset@imlistening-mail.perrysmithmoss.com
    secrets:
      - {source: im_listening_database_url_v1, target: database_url, uid: "1000", mode: 0400}
      - {source: im_listening_session_secret_v1, target: session_secret, uid: "1000", mode: 0400}
      - {source: im_listening_redis_url_v1, target: redis_url, uid: "1000", mode: 0400}
      - {source: im_listening_resend_key_v1, target: smtp_password, uid: "1000", mode: 0400}
    configs:
      - {source: im_listening_postgres_ca_v1, target: /etc/im-listening/postgres-ca.crt}
    networks: [portfolio_network, sessions]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 16777216, mode: 01777}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      start_period: 45s
      retries: 3
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: portfolio_network
        traefik.http.routers.im-listening-api.rule: Host(`im-listening-api.perrysmithmoss.com`)
        traefik.http.routers.im-listening-api.entrypoints: websecure
        traefik.http.routers.im-listening-api.tls.certresolver: myresolver
        traefik.http.services.im-listening-api.loadbalancer.server.port: "5050"
      resources:
        limits: {memory: 384M, cpus: "0.75", pids: 128}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 90s
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 100s

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    user: "999:1000"
    command: [redis-server, /run/secrets/redis_config, --appendonly, "yes", --maxmemory, 64mb]
    secrets:
      - {source: im_listening_redis_config_v1, target: redis_config, uid: "999", mode: 0400}
    networks: [sessions]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "read -r _ password < /run/secrets/redis_config && REDISCLI_AUTH=\"$$password\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {memory: 192M, cpus: "0.25", pids: 64}
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints: [node.role == manager]

networks:
  portfolio_network:
    external: true
  sessions:
    driver: overlay
    internal: true

volumes:
  redis-data:

configs:
  im_listening_postgres_ca_v1: {external: true}

secrets:
  im_listening_database_url_v1: {external: true}
  im_listening_session_secret_v1: {external: true}
  im_listening_resend_key_v1: {external: true}
  im_listening_redis_url_v1: {external: true}
  im_listening_redis_config_v1: {external: true}
