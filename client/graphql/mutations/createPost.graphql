mutation CreatePost(
  $artistName: String!
  $albumName: String!
  $rating: Float!
  $title: String!
  $previewSongUrl: String
  $spotifyTrackId: String
  $genre: String!
  $genres: [String!]!
  $albumImage: String!
) {
  createPost(
    artistName: $artistName
    albumName: $albumName
    rating: $rating
    title: $title
    previewSongUrl: $previewSongUrl
    spotifyTrackId: $spotifyTrackId
    genre: $genre
    genres: $genres
    albumImage: $albumImage
  ) {
    id
    createdAt
    updatedAt
    title
    previewSongUrl
    genre
    artistName
    albumName
    rating
    albumImage
  }
}
