query GetRecentPosts($limit: Int!, $cursor: DateTimeISO, $cursorId: Int) {
  getRecentPosts(limit: $limit, cursor: $cursor, cursorId: $cursorId) {
    hasMore
    posts {
      id
      createdAt
      updatedAt
      title
      previewSongUrl
      artistName
      albumName
      genre
      albumImage
      rating
      author {
        id
        firstName
        lastName
        username
        profile {
          id
          bio
          avatar
        }
      }
    }
  }
}
