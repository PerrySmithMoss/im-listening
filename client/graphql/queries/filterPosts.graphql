query FilterPosts($limit: Int!, $cursor: DateTimeISO, $cursorId: Int, $genres: [String!]!) {
  filterPosts(limit: $limit, cursor: $cursor, cursorId: $cursorId, genres: $genres) {
    hasMore
    posts {
      id
      createdAt
      updatedAt
      title
      previewSongUrl
      artistName
      albumName
      genre
      albumImage
      rating
      author {
        id
        firstName
        lastName
        username
        profile {
          id
          bio
          avatar
        }
      }
      songGenres {
        genre
      }
    }
  }
}
