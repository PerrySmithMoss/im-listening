name: Checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: ./scripts/setup-local.sh
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm audit --prefix server && npm audit --prefix client
      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis
      - name: Apply migrations to the fresh PostgreSQL database
        run: npm run db:migrate --prefix server
      - run: npm run build --prefix server
      - run: npm test --prefix server
      - run: npm run gen --prefix client && git diff --exit-code -- client/graphql/generated
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
